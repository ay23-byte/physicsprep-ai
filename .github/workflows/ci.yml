name: CI

on:
  push:
    branches:
      - main
      - fix/evidence-export-quality
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint, unit tests, and production build
        run: npm run check

      - name: Run isolated API regression tests
        run: npm run test:api:regression
